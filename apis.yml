name: Dalrymple Bay Infrastructure

description: 'Dalrymple Bay Infrastructure (DBI) is an ASX-listed Australian infrastructure company whose
  foundation asset is the Dalrymple Bay Terminal (DBT) in Queensland, described by DBI as the world''s
  largest metallurgical coal export facility and a global gateway from the Bowen Basin. DBI aims to provide
  safe and efficient terminal infrastructure and services for producers and consumers of Australian coal
  exports, delivering value to securityholders through stable cashflows and investment in capacity
  expansion. Its website publishes investor relations material (ASX announcements, reports, distributions),
  terminal access and regulatory information, sustainability and corporate governance documents. No public
  developer API, documentation or developer portal was found on its site.'

